[package]
name = "WaveR"
version = "1.1.2"
edition = "2024"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] } # Tells eframe to use glow (OpenGL) as the renderer. This reduces the crashing on some systems.
egui = "0.37.0"
rfd = "0.17.2"
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-flac", "symphonia-wav", "symphonia-vorbis"] }
webbrowser = "1.2.6"

[build-dependencies]
winresource = "0.1"
