[package]
name = "WaveR"
version = "1.2.1"
edition = "2024"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.37.0"
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-flac", "symphonia-wav", "symphonia-vorbis"] }
webbrowser = "1.2.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
rfd = "0.17.2"

[target.'cfg(not(windows))'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }

[profile.release]
strip = true # smaller exe, no real cost at compile time
