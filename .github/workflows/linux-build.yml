name: Linux build

on:
  workflow_dispatch:   # manual run: builds and uploads the tar.gz as an artifact

jobs:
  linux:
    # The host can be anything with Docker; the OS that matters for the
    # produced binary is the container image below (old glibc = wide compat).
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y libasound2-dev pkg-config build-essential curl

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compile release
        run: cargo build --release --locked

      - name: Package tar.gz
        run: |
          VER="${GITHUB_REF_NAME#v}"         # tag "v2.0.0" -> "2.0.0"
          [[ "$VER" =~ ^[0-9] ]] || VER=dev  # manual runs have a branch name, not a tag
          mkdir -p staging
          cp target/release/WaveR staging/
          cp LICENSE staging/
          cp licenses/THIRD-PARTY-NOTICES.txt staging/
          tar -czf "WaveR-$VER-linux-x86_64.tar.gz" -C staging .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: WaveR-linux
          path: WaveR-*.tar.gz
          if-no-files-found: error
