name: Release
run-name: Create draft for release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"      # the * means "anything after the v"
  workflow_dispatch:   # lets you also start it by hand from the GitHub page

permissions:
  contents: write

jobs:
  create:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Compile release
        run: cargo build --release --locked
      - name: dir
        run: dir target\release\WaveR.exe
      - name: Create installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" WaveR.iss'
      - name: dist
        run: dir dist
      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: WaveR-Setup           # the name you will see in the Artifacts list
          path: dist/*.exe            # which files to upload; the * matches any name
          if-no-files-found: error    # fail the step if no installer exists
          retention-days: 5           # how many days GitHub keeps it
      - name: Create portable zip
        run: |
          Copy-Item LICENSE dist\WaveR-LICENSE.txt
          Compress-Archive -Path target\release\WaveR.exe, dist\WaveR-LICENSE.txt, licenses\THIRD-PARTY-NOTICES.txt -DestinationPath dist\WaveR-x64.zip
      - name: Get ZIP hash
        run: |
          $hash = (Get-FileHash dist\WaveR-x64.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $hash"
          "SHA256 of WaveR-x64.zip: $hash" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "$hash  WaveR-x64.zip" | Out-File -Encoding ascii dist\WaveR-x64.zip.sha256
      - name: Create release draft
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.exe dist/*.zip dist/*.sha256  --title "${{ github.ref_name }}" --generate-notes --draft
