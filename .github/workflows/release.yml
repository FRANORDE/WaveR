name: Release

on:
  push:
    tags:
      - "v*"      # the * means "anything after the v"
  workflow_dispatch:   # lets you also start it by hand from the GitHub page

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - name: Compile relase
        run: cargo build --release --locked
      - name: dir
        run: dir target\release\WaveR.exe
      - name: Create installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" WaveR.iss'
      - name: dist
        run: dir dist
      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: WaveR-Setup           # the name you will see in the Artifacts list
          path: dist/*.exe            # which files to upload; the * matches any name
          if-no-files-found: error    # fail the step if no installer exists
          retention-days: 7           # how many days GitHub keeps it
      - name: Create portable zip
        run: Compress-Archive -Path target\release\WaveR.exe, LICENSE, licenses\THIRD-PARTY-NOTICES.txt -DestinationPath dist\WaveR-x64.zip
      - name: Create draft
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.exe dist/*.zip --title "WaveR ${{ github.ref_name }}" --generate-notes --draft
